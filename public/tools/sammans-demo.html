<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sammans — walkthrough</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  /* Samma färgschema som sidan runt omkring – annars målar webbläsaren en vit yta bakom ramen i mörkt läge. */
  color-scheme:light dark;
  --ground:#F2F4F0;
  --surface:#FFFFFF;
  --ink:#151A16;
  --muted:#5C665F;
  --rule:#D6DCD6;
  --hair:#E6EAE5;
  --rose:#C2465A;
  --shadow:rgba(20,30,24,.16);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0E1210; --surface:#161B18; --ink:#E4E9E4; --muted:#8B958E;
    --rule:#2A312C; --hair:#1E2420; --rose:#E07587; --shadow:rgba(0,0,0,.5);
  }
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E1210; --surface:#161B18; --ink:#E4E9E4; --muted:#8B958E;
  --rule:#2A312C; --hair:#1E2420; --rose:#E07587; --shadow:rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:transparent;color:var(--ink);
  font-family:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
.wrap{padding:0 0 8px}

.stage{
  display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);
  gap:48px;align-items:start;
}
@media(max-width:820px){
  .stage{grid-template-columns:1fr;gap:30px;justify-items:center}
  .readout{max-width:540px}
}

.phonecol{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%}
/* The phone is a device, not page chrome: the same in either theme. */
.phone{
  position:relative;width:300px;max-width:84vw;aspect-ratio:1206/2622;
  border-radius:46px;padding:11px;background:#1B1D1C;
  box-shadow:0 22px 48px var(--shadow), inset 0 0 0 1px rgba(255,255,255,.08);
}
.phone .screen{
  position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:#fff;
}
.phone img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .45s ease;
}
.phone img.on{opacity:1}
/* Långa skärmar: bilden är hela sidan och glider uppåt i skärmen, som när man scrollar. */
.phone img.tall{height:auto;bottom:auto;object-fit:fill;will-change:transform}
/* Status- och flikraden ligger still medan sidan glider under dem. */
.phone img.bar{height:auto;bottom:auto;z-index:2;object-fit:fill}
.phone img.bar.bot{top:auto;bottom:0}
.phone img.bar.top.on{opacity:var(--top,0)}

.controls{display:flex;align-items:center;gap:8px}
.btn{
  font-family:inherit;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
  color:var(--muted);background:var(--surface);border:1px solid var(--rule);
  padding:7px 12px;border-radius:999px;cursor:pointer;
}
.btn:hover{color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.counter{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:center}

.readout{width:100%;min-width:0}
.chapter{
  font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--rose);font-weight:600;margin-bottom:12px;
}
.readout h2{
  font-family:"Archivo",ui-sans-serif,system-ui,sans-serif;
  font-weight:600;font-size:clamp(22px,3.4vw,30px);
  letter-spacing:-.018em;line-height:1.14;margin:0 0 12px;text-wrap:balance;
}
.readout p{margin:0 0 14px;max-width:60ch;color:var(--muted);font-size:15.5px}
.readout p strong{color:var(--ink);font-weight:600}

.rail{
  margin-top:30px;display:flex;flex-direction:column;gap:2px;
  border-top:1px solid var(--hair);padding-top:18px;
}
.rail button{
  display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:14px;
  background:none;border:0;padding:8px 4px;cursor:pointer;text-align:left;
  font-family:inherit;color:var(--muted);font-size:14px;border-radius:6px;
  transition:color .15s,background .15s;
}
.rail button:hover{color:var(--ink);background:var(--hair)}
.rail button:focus-visible{outline:2px solid var(--rose);outline-offset:-2px}
.rail button[aria-current="true"]{color:var(--ink);font-weight:600}
.rail .n{font-size:11px;letter-spacing:.08em;color:var(--muted);font-variant-numeric:tabular-nums}
.rail button[aria-current="true"] .n{color:var(--rose)}
.rail .meter{width:52px;height:3px;background:var(--hair);border-radius:2px;overflow:hidden}
.rail .meter i{display:block;height:100%;width:0;background:var(--rose);transition:width .2s linear}

@media (prefers-reduced-motion:reduce){
  .phone img{transition:none}
  .rail .meter i{transition:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <div class="phonecol">
      <div class="phone" aria-hidden="true"><div class="screen" id="screen"></div></div>
      <div class="controls">
        <button class="btn" id="prev" type="button">Prev</button>
        <button class="btn" id="play" type="button">Pause</button>
        <button class="btn" id="next" type="button">Next</button>
        <span class="counter" id="counter">1 / 9</span>
      </div>
    </div>
    <div class="readout" aria-live="polite">
      <div class="chapter" id="chapter"></div>
      <h2 id="title"></h2>
      <div id="body"></div>
      <nav class="rail" id="rail" aria-label="Walkthrough steps"></nav>
    </div>
  </div>
</div>

<script>
(function(){
  var STEPS = [
    { img:"today", ch:"Today",
      title:"One card for the day",
      body:"<p>The day's activities, <strong>today's moment</strong> and the next small thing — in one card, at the top. An empty day is not a zero. It is a calm day, and it says so.</p>" },
    { img:"moment", ch:"Today's moment",
      title:"Two minutes, three steps",
      body:"<p>How you are, in words rather than scores. A small step for you. Something for the two of you. <strong>That is the whole ritual.</strong></p><p>On a heavy day it offers the easier version, or none at all.</p>" },
    { img:"me-scroll", scroll:true, top:"me-top", bot:"me-bot", dur:26000, ch:"Me",
      title:"A mirror first, then the rest",
      body:"<p>At the top, a mirror. It notices what keeps coming back and follows up a week later — once. Sometimes it shows you <strong>something you wrote a month ago</strong> and asks how that is now.</p><p>Below it: every day, on your own, and <strong>Grow</strong> — understand yourself, free yourself, find your direction — and, last, looking back.</p>" },
    { img:"confidence", scroll:true, top:"confidence-top", bot:"confidence-bot", dur:15000, ch:"Grow",
      title:"Sixty small steps toward self-confidence",
      body:"<p>Daring to be who you are, without living for other people's approval. Inspired by Alfred Adler's ideas, in its own words.</p><p>One exercise at a time, in order, at your own pace: you are enough, whose task is it, the courage to be imperfect, contributing and belonging, living here and now. <strong>No grades — trying is enough.</strong></p><p>Next to it: <strong>Love – a task for two</strong>, after Adler. Equals, whose task is whose, and getting your head out of the sand.</p>" },
    { img:"us", ch:"The two of us",
      title:"Two phones, one shared space",
      body:"<p>Our pulse, Time for us, love languages, shared dreams and the year. What is shared travels through your own iCloud, encrypted. <strong>The diary, the energy and the hard parts stay on your phone.</strong></p>" },
    { img:"roleplay", ch:"Role-play",
      title:"Practise the conversation before it happens",
      body:"<p>An ordinary evening, three lines. Choose what you say and see how it tends to land. If it closes, the conversation stops and asks what you do now — because <strong>repair is the skill</strong>, not getting it right the first time.</p>" },
    { img:"life", ch:"Life",
      title:"The rest of the week",
      body:"<p>Food and recipes, the year wheel, long weekends it finds for you, training, people you want to remember. The things that otherwise live in one person's head.</p>" },
    { img:"recipes", ch:"Life",
      title:"A recipe book you rate together",
      body:"<p>Paste a link or a recipe and it is in. Stars for what you liked, filters for quick, light and vegetarian, and <strong>your favourites first</strong>.</p><p>Where Apple Intelligence is on, it can suggest a recipe from what you already have — on the phone.</p>" },
    { img:"recap", ch:"The first weeks",
      title:"Honest about what it doesn't know yet",
      body:"<p>A guided first month, one small step a day, with a summary on day 7, 14 and 30. Where there isn't enough data, it says so. <strong>Patterns appear when there are days to compare</strong>, not before.</p>" }
  ];
  var DUR = 8000;
  function dur(i){ return STEPS[i].dur || DUR; }
  // Scrollningen står still en stund i början och slutet, så att man hinner läsa.
  function scrollAt(p){
    var q = Math.min(1, Math.max(0, (p - 0.12) / 0.78));
    return q < 0.5 ? 2 * q * q : 1 - Math.pow(-2 * q + 2, 2) / 2;
  }
  function setScroll(i, p){
    var im = imgs[i];
    if (!STEPS[i].scroll) return;
    var dist = Math.max(0, im.offsetHeight - screen.clientHeight);
    var y = dist * scrollAt(p);
    im.style.transform = "translateY(" + (-y) + "px)";
    // Det hopfällda navigeringsfältet tonar in när sidan börjat röra sig, som i appen.
    screen.style.setProperty("--top", Math.min(1, y / 40));
  }
  var screen = document.getElementById("screen");
  STEPS.forEach(function(s, i){
    var im = document.createElement("img");
    im.src = "/tools/sammans/" + s.img + ".jpg";
    im.alt = "";
    im.className = s.scroll ? "shot tall" : "shot";
    im.loading = i < 2 ? "eager" : "lazy";
    screen.appendChild(im);
    ["top", "bot"].forEach(function(k){
      if (!s[k]) return;
      var b = document.createElement("img");
      b.src = "/tools/sammans/" + s[k] + ".jpg"; b.alt = ""; b.loading = "lazy";
      b.className = "bar " + k; b.dataset.step = i;
      screen.appendChild(b);
    });
  });
  var imgs = screen.querySelectorAll("img.shot");
  var bars = screen.querySelectorAll("img.bar");
  var rail = document.getElementById("rail");
  STEPS.forEach(function(s, i){
    var b = document.createElement("button");
    b.type = "button";
    b.innerHTML = '<span class="n">' + String(i + 1).padStart(2, "0") + '</span><span>' + s.title + '</span><span class="meter"><i></i></span>';
    b.addEventListener("click", function(){ go(i, true); });
    rail.appendChild(b);
  });
  var btns = rail.querySelectorAll("button");
  var paused = 0, cur = 0, playing = !matchMedia("(prefers-reduced-motion: reduce)").matches, t0 = performance.now();
  var playBtn = document.getElementById("play");
  playBtn.textContent = playing ? "Pause" : "Play";

  function render(){
    var s = STEPS[cur];
    imgs.forEach(function(im, i){ im.classList.toggle("on", i === cur); });
    bars.forEach(function(b){ b.classList.toggle("on", +b.dataset.step === cur); });
    setScroll(cur, 0);
    document.getElementById("chapter").textContent = s.ch;
    document.getElementById("title").textContent = s.title;
    document.getElementById("body").innerHTML = s.body;
    document.getElementById("counter").textContent = (cur + 1) + " / " + STEPS.length;
    btns.forEach(function(b, i){
      b.setAttribute("aria-current", i === cur ? "true" : "false");
      b.querySelector(".meter i").style.width = i < cur ? "100%" : "0";
    });
  }
  function go(i, user){
    cur = (i + STEPS.length) % STEPS.length;
    t0 = performance.now(); paused = 0;
    if (user && playing) { playing = false; playBtn.textContent = "Play"; }
    render();
  }
  document.getElementById("prev").addEventListener("click", function(){ go(cur - 1, true); });
  document.getElementById("next").addEventListener("click", function(){ go(cur + 1, true); });
  playBtn.addEventListener("click", function(){
    // Fortsätt där den stod, så att en lång skärm inte hoppar tillbaka till toppen.
    var now = performance.now();
    if (playing) paused = now - t0; else t0 = now - (paused || 0);
    playing = !playing;
    playBtn.textContent = playing ? "Pause" : "Play";
  });
  function tick(now){
    if (playing) {
      var p = Math.min(1, (now - t0) / dur(cur));
      btns[cur].querySelector(".meter i").style.width = (p * 100) + "%";
      setScroll(cur, p);
      if (p >= 1) go(cur + 1, false);
    }
    requestAnimationFrame(tick);
  }
  render();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
