`},{id:`small`,label:`Nordvik Insurance`,note:`9 capabilities`,text:`# Nordvik Insurance — a fictional mid-sized insurer.
#
# A fixture, and an argument. Every finding the tool computes appears here at
# least once, so the file doubles as a test case and as the worked example.
#
# Nothing in it is unusual. That is the point: no villain, no crisis, and
# nothing here that would look wrong in an interview with anyone involved.

meta:
  name: Nordvik Insurance
  drawn_by: per.christoffer
  drawn_on: 2026-08-26
  note: >
    First pass, from a whiteboard photo plus two conversations.
    Most of this is unobserved. That is the honest state of a first map.

# ---------------------------------------------------------------------------
# DURABLE — survives the reorg
#
# Four levels. Level 1 is a coarse sorting; 2, 3 and 4 add detail. Below four
# you are describing a process, and the tool says so.
# ---------------------------------------------------------------------------

capabilities:
  # ---- level 1 ----
  - id: cap.claims
    name: Claims
    description: >
      Everything from a customer telling us something has happened to the
      money leaving our account. The part of the business a customer only
      meets on their worst day.
    children: [cap.receive-notification, cap.assess-damage, cap.settle-claim, cap.pay-out]

  - id: cap.underwriting
    name: Underwriting
    description: >
      Deciding what risk we are willing to carry and at what price, and
      turning that decision into cover a customer actually holds.
    children: [cap.price-policy, cap.issue-policy]

  - id: cap.customer
    name: Customer
    description: >
      Knowing who our customers are and being reachable by them. Cuts across
      both of the others, which is why it keeps being nobody's.
    children: [cap.identify-customer, cap.serve-customer]

  # ---- level 2, Claims ----
  - id: cap.receive-notification
    name: Receive a notification of loss
    outcome: A claimant's report is recorded and acknowledged.
    description: >
      Taking the first report through any channel, establishing that a policy
      exists, and giving the claimant a reference and a sense of what happens next.
    information: [info.claim]

  - id: cap.assess-damage
    name: Assess damage
    outcome: The extent and cause of a loss are established.
    description: >
      Working out what actually happened and what it will cost to put right.
      The judgement-heavy part, and the one most often mistaken for admin.
    children: [cap.inspect-vehicle, cap.estimate-repair]
    information: [info.damage]

  - id: cap.settle-claim
    name: Settle a claim
    outcome: A claimant receives a decision and, where due, payment.
    description: >
      Applying the terms of the agreement to an assessed loss and telling the
      claimant the answer, including when the answer is no.
    information: [info.claim, info.agreement]
    # FINDING: two claimed owners; owner is not the developer; two systems.

  - id: cap.pay-out
    name: Pay out
    outcome: Money reaches the claimant.
    description: Executing payment against a settled claim, and reconciling it.

  # ---- level 3, under Assess damage ----
  - id: cap.inspect-vehicle
    name: Inspect a vehicle
    outcome: A physical assessment exists for a damaged vehicle.
    description: >
      Getting eyes on the vehicle — in person, through a partner garage, or
      increasingly from photographs the claimant takes themselves.
    information: [info.damage]

  - id: cap.estimate-repair
    name: Estimate repair cost
    outcome: A defensible figure for putting the vehicle right.
    description: >
      Turning an inspection into a number, using parts pricing, labour rates
      and whatever the market is doing to second-hand values this quarter.
    children: [cap.price-parts]

  # ---- level 4, the limit ----
  - id: cap.price-parts
    name: Price parts
    outcome: Current prices for the parts a repair needs.
    description: >
      Looking up what a wing mirror costs this week. As deep as this map goes,
      and arguably already a process rather than a capability.

  # ---- level 2, Underwriting ----
  - id: cap.price-policy
    name: Price a policy
    outcome: A risk carries a premium the company is willing to accept.
    description: >
      Turning what we know about a customer and a vehicle into a number, and
      deciding whether we want the risk at all.
    information: [info.customer]

  - id: cap.issue-policy
    name: Issue a policy
    outcome: A customer holds cover that has started.
    description: >
      Producing the agreement, taking first payment, and making the cover real
      in every system that needs to know about it.
    information: [info.agreement]
    # FINDING: orphan — no owns edge anywhere in this file.

  # ---- level 2, Customer ----
  - id: cap.identify-customer
    name: Identify a customer
    outcome: We know, reliably, who we are dealing with.
    description: >
      Establishing identity across channels and matching it to what we already
      hold. Everything downstream assumes this worked.
    information: [info.customer]
    # FINDING: mastered here and in Price a policy. Two masters, no rule.

  - id: cap.serve-customer
    name: Serve a customer
    outcome: A customer gets an answer without having to know our org chart.
    description: >
      Answering questions, taking changes, and handling the ordinary contact
      that is neither a claim nor a sale.

# ---------------------------------------------------------------------------
# ARRANGEMENT — this decade's answer
# ---------------------------------------------------------------------------

org_units:
  # An org tree, because how far a disagreement has to climb depends on it.
  - id: org.exec
    name: Executive
    description: Where anything the rest of them cannot settle ends up.

  - id: org.insurance
    name: Insurance
    parent: org.exec
    lead: per.mikael
    description: The underwriting and claims side of the house.

  - id: org.technology
    name: Technology
    parent: org.exec
    lead: per.lars
    description: Everything that builds or runs software.

  - id: org.claims-ops
    name: Claims Operations
    parent: org.insurance
    lead: per.anna
    team_type: stream-aligned
    headcount: 14
    description: Handles claims end to end, and has done since long before anyone drew a map.
    mandate:
      business: full
      technical: none
      spend_limit_eur: 25000
      note: Can settle a claim to any value; cannot change the system that records it.

  - id: org.underwriting
    name: Underwriting
    parent: org.insurance
    lead: per.mikael
    team_type: stream-aligned
    headcount: 9
    mandate:
      business: full
      technical: advisory

  - id: org.finance
    name: Finance
    parent: org.exec
    lead: per.sara
    team_type: stream-aligned
    headcount: 6
    mandate:
      business: full
      technical: none

  - id: org.digital
    name: Digital
    parent: org.technology
    lead: per.eva
    team_type: stream-aligned
    headcount: 11
    description: Builds the customer-facing surface. Calls itself a product team.
    mandate:
      business: none
      technical: full
      note: >
        Has a technical product owner and no business mandate. Every question
        about what a thing is for leaves the team to find an answer.
    # FINDING: stream-aligned, five domains, and cannot commit to an outcome.

  - id: org.platform
    name: Platform
    parent: org.technology
    lead: per.lars
    team_type: platform
    headcount: 8
    mandate:
      business: none
      technical: full

  - id: org.data
    name: Data
    parent: org.technology
    lead: per.tomas
    team_type: complicated-subsystem
    headcount: 4
    description: Holds the pricing and parts models nobody else wants to.
    mandate:
      business: advisory
      technical: full

  - id: org.architecture
    name: Architecture
    parent: org.technology
    lead: per.johan
    team_type: enabling
    headcount: 3
    mandate:
      business: advisory
      technical: advisory
    # FINDING: an enabling team that has become a place decisions travel to.

    vendor: in-house
    hosting: saas
    description: What a customer actually touches.

  - id: sys.partsdb
    name: PartsPrice
    vendor: external
    hosting: saas
    description: Third-party parts pricing feed, renewed annually and never reviewed.

# ---------------------------------------------------------------------------
# MOVEMENT — the sap
# ---------------------------------------------------------------------------

information_concepts:
  - id: info.customer
    name: Customer
    definition: A party with whom we hold at least one active agreement.
    agreed: false
    relates_to: [info.agreement, info.claim]
    # FINDING: mastered in two capabilities; transformed at three points.

  - id: info.claim
    name: Claim
    definition: A request for payment under an agreement.
    agreed: true
    relates_to: [info.agreement]

  - id: info.agreement
    name: Agreement
    definition: The contract under which cover is provided.
    agreed: deliberately-local
    note: >
      Underwriting and Finance mean different things by this and both are right
      for their purpose. Recorded on purpose, not by accident.

  - id: info.damage
    name: Damage
    definition: What happened to the insured thing, and what it will cost.
    agreed: false

interfaces:
  - id: if.claim-status
    name: Claim status lookup
    exposed_by: cap.settle-claim
    shape: sync
    rung: queue
    discoverable: false
    carries: [info.claim, info.customer]

  - id: if.policy-check
    name: Cover check
    exposed_by: cap.issue-policy
    shape: sync
    rung: know-a-guy
    discoverable: false
    note: >
      Reached by emailing Tomas. There is a form on the intranet that submits
      to a queue nobody has monitored since 2024.

  - id: if.customer-lookup
    name: Customer lookup
    exposed_by: cap.identify-customer
    shape: sync
    rung: queue
    discoverable: false
    external: false
    # FINDING: four teams reach it, and it is a queue.

flows:
  - id: flow.motor-claim
    name: Motor claim — first notification to payment
    external_trigger: Claimant reports a collision
    external_outcome: Claimant is paid
    steps: [cap.receive-notification, cap.assess-damage, cap.settle-claim, cap.pay-out]
    returns_to: null
    value_per_month_eur: 50000
    # FINDING: open loop. Nothing reaches pricing.

  - id: flow.new-product
    name: Launch a new motor product
    external_trigger: Market opportunity identified
    external_outcome: Customers can buy the product
    steps: [cap.price-policy, cap.issue-policy]
    returns_to: cap.price-policy
    value_per_month_eur: 50000

decision_gates:
  - id: gate.arch-board
    name: Architecture Board
    authority: org.architecture
    cadence: fortnightly
    scope: Any change touching more than one system.
    gates: [flow.new-product]
    deliberation_median_minutes: 12
    waiting_median_days: 19
    bypass_rate: 0.6
    bypass_note: >
      Of the last ten qualifying decisions, six never reached the board.
      Not hidden — never escalated, because escalating was the cost.

  - id: gate.security-review
    name: Security review
    authority: org.platform
    cadence: weekly
    scope: Anything touching customer data.
    gates: [flow.new-product]
    deliberation_median_minutes: 45
    waiting_median_days: 8
    bypass_rate: 0.1

  - id: gate.portfolio
    name: Portfolio meeting
    authority: org.finance
    cadence: quarterly
    scope: Anything requiring new budget.
    gates: [flow.new-product]
    deliberation_median_minutes: 20
    waiting_median_days: 34

# ---------------------------------------------------------------------------
# EDGES
# ---------------------------------------------------------------------------

edges:
  # --- owns: accountable ---------------------------------------------------
  - { type: owns, from: org.claims-ops,   to: cap.receive-notification, asserted_by: [per.anna] }
  - { type: owns, from: org.claims-ops,   to: cap.assess-damage,        asserted_by: [per.anna] }
  - { type: owns, from: org.claims-ops,   to: cap.inspect-vehicle,      asserted_by: [per.anna] }
  - { type: owns, from: org.claims-ops,   to: cap.estimate-repair,      asserted_by: [per.anna] }
  - { type: owns, from: org.claims-ops,   to: cap.settle-claim,         asserted_by: [per.anna, per.johan] }
  - { type: owns, from: org.underwriting, to: cap.settle-claim,         asserted_by: [per.mikael] }
  #   ^ FINDING: boundary dispute. Nobody has been in a room about it.
  - { type: owns, from: org.finance,      to: cap.pay-out,              asserted_by: [per.sara] }
  - { type: owns, from: org.underwriting, to: cap.price-policy,         asserted_by: [per.mikael] }
  - { type: owns, from: org.digital,      to: cap.serve-customer,       asserted_by: [per.eva] }
  - { type: owns, from: org.data,         to: cap.price-parts,          asserted_by: [per.tomas] }
  #   cap.issue-policy and cap.identify-customer have no owner at all.

  # --- develops: actually changes it --------------------------------------
  - { type: develops, from: org.platform, to: cap.settle-claim }
  #   ^ FINDING: Claims Ops owns it, Platform builds it.
  - { type: develops, from: org.digital,  to: cap.settle-claim }
  #   ^ FINDING: two teams change the same capability.
  - { type: develops, from: org.digital,  to: cap.receive-notification }
  - { type: develops, from: org.digital,  to: cap.serve-customer }
  - { type: develops, from: org.digital,  to: cap.identify-customer }
  - { type: develops, from: org.digital,  to: cap.issue-policy }
  #   ^ FINDING: Digital now carries five, and owns two of them.
  - { type: develops, from: org.platform, to: cap.price-policy }
  - { type: develops, from: org.data,     to: cap.estimate-repair }
  - { type: develops, from: org.data,     to: cap.price-parts }

  # --- uses: consumes it ---------------------------------------------------
  - { type: uses, from: org.claims-ops,   to: cap.identify-customer }
  - { type: uses, from: org.underwriting, to: cap.identify-customer }
  - { type: uses, from: org.digital,      to: cap.identify-customer }
  - { type: uses, from: org.finance,      to: cap.identify-customer }
  #   ^ FINDING: four teams depend on a capability nobody owns, through a queue.
  - { type: uses, from: org.claims-ops,   to: cap.price-policy }
  - { type: uses, from: org.finance,      to: cap.settle-claim }

  # --- competence ----------------------------------------------------------
  - { type: holds,  from: per.anna,   to: comp.claims-law }
  - { type: holds,  from: per.mikael, to: comp.underwriting }
  - { type: holds,  from: per.tomas,  to: comp.policyadmin }
  - { type: staffs, from: comp.claims-law,   to: cap.settle-claim }
  - { type: staffs, from: comp.underwriting, to: cap.price-policy }
  - { type: staffs, from: comp.policyadmin,  to: cap.issue-policy }

  # --- realization ---------------------------------------------------------
  - { type: realizes, from: sys.claimscore,  to: cap.settle-claim }
  - { type: realizes, from: sys.claims-wf,   to: cap.settle-claim }
  #   ^ FINDING: two systems, one capability.
  - { type: realizes, from: sys.claimscore,  to: cap.assess-damage }
  - { type: realizes, from: sys.claimscore,  to: cap.pay-out }
  #   ^ FINDING: ClaimsCore now sits under three owners' capabilities.
  - { type: realizes, from: sys.policyadmin, to: cap.issue-policy }
  - { type: realizes, from: sys.crm,         to: cap.price-policy }
  - { type: realizes, from: sys.crm,         to: cap.identify-customer }
  - { type: realizes, from: sys.portal,      to: cap.receive-notification }
  - { type: realizes, from: sys.portal,      to: cap.serve-customer }
  - { type: realizes, from: sys.partsdb,     to: cap.price-parts }

  # --- the system map ------------------------------------------------------
  - { type: depends_on, from: sys.portal,     to: sys.crm }
  - { type: depends_on, from: sys.crm,        to: sys.claimscore }
  - { type: depends_on, from: sys.claimscore, to: sys.policyadmin }
  - { type: depends_on, from: sys.claims-wf,  to: sys.claimscore }
  - { type: depends_on, from: sys.partsdb,    to: sys.claimscore }
  #   ^ FINDING: chain four deep, and three systems lean on ClaimsCore.

  # --- which teams use which systems --------------------------------------
  - { type: uses, from: org.claims-ops,   to: sys.claimscore }
  - { type: uses, from: org.finance,      to: sys.claimscore }
  - { type: uses, from: org.digital,      to: sys.claimscore }
  - { type: uses, from: org.underwriting, to: sys.claimscore }
  #   ^ FINDING: four teams on one system.

  # --- calls, with handoff cost -------------------------------------------
  - type: calls
    from: cap.assess-damage
    to: if.claim-status
    handoff: { reconstruction_hours: 4, frequency_per_year: 52 }

  - type: calls
    from: cap.price-policy
    to: if.policy-check
    handoff: { reconstruction_hours: 6, frequency_per_year: 24 }

  # --- integrations, with transformation ----------------------------------
  - type: calls
    from: sys.portal
    to: if.customer-lookup
    shape: sync
    protocol: REST
    carries: [info.customer]
    transforms:
      - concept: info.customer
        note: The portal treats an unregistered visitor as a customer. CRM does not.

  - type: calls
    from: sys.crm
    to: if.claim-status
    shape: sync
    protocol: REST
    carries: [info.customer, info.claim]
    transforms:
      - concept: info.customer
        note: CRM customer includes prospects. ClaimsCore does not.

  - type: calls
    from: sys.claimscore
    to: if.policy-check
    shape: sync
    protocol: MQ
    carries: [info.customer, info.agreement]
    transforms:
      - concept: info.customer
        note: PolicyAdmin keys on national ID. ClaimsCore keys on a claim party ID.

  # --- informs: what information moves between capabilities ---------------
  - { type: informs, from: cap.identify-customer, to: cap.price-policy,    carries: [info.customer] }
  - { type: informs, from: cap.identify-customer, to: cap.settle-claim,    carries: [info.customer] }
  - { type: informs, from: cap.receive-notification, to: cap.assess-damage, carries: [info.claim] }
  - { type: informs, from: cap.inspect-vehicle,   to: cap.estimate-repair, carries: [info.damage] }
  - { type: informs, from: cap.estimate-repair,   to: cap.settle-claim,    carries: [info.damage] }
  - { type: informs, from: cap.issue-policy,      to: cap.settle-claim,    carries: [info.agreement] }
  - { type: informs, from: cap.settle-claim,      to: cap.pay-out,         carries: [info.claim] }

  # --- what a team has to go to before it can move -------------------------
  - type: blocks
    from: gate.arch-board
    to: org.digital
    note: any change touching more than one system
  - type: blocks
    from: org.underwriting
    to: org.digital
    note: anything that changes what a policy means, which is most things
  - type: blocks
    from: gate.portfolio
    to: org.digital
    note: anything needing budget, and the meeting is quarterly
  - type: blocks
    from: gate.arch-board
    to: org.platform

  # --- gates ---------------------------------------------------------------
  - { type: gates, from: gate.arch-board,      to: flow.new-product }
  - { type: gates, from: gate.security-review, to: flow.new-product }
  - { type: gates, from: gate.portfolio,       to: flow.new-product }
